name: Build & Release

on: [push]

jobs:
  build:
    strategy:
      matrix:
        node: ["24.x"]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Wiz sensor
        uses: Web3Auth/.github/.github/actions/wiz-sensor@545f7c255313f85d38a02dc36c4ad01387d03149 # v1.0.0
        with:
          enabled: ${{ vars.WIZ_SENSOR_ENABLED }}
          token: ${{ secrets.WIZ_SENSOR_TOKEN }}
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # Set the credentials from repository settings/secrets
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION_US }}

      - name: Build new vue demo app
        run: |
          cd demo/vue-app-new
          npm install
          npm run build
        env:
          VITE_APP_SOLANA_MAINNET_RPC: ${{ secrets.SOLANA_MAINNET_RPC }}
          VITE_APP_SOLANA_TESTNET_RPC: ${{ secrets.SOLANA_TESTNET_RPC }}
          VITE_APP_SOLANA_DEVNET_RPC: ${{ secrets.SOLANA_DEVNET_RPC }}
          VITE_APP_PIMLICO_API_KEY: ${{ secrets.PIMLICO_API_KEY }}

        # Upload to S3. The sync action cannot use OIDC session credentials.
      - name: sync vue app new s3
        if: github.ref == 'refs/heads/master'
        run: aws s3 sync ./demo/vue-app-new/dist s3://demo-sdk.web3auth.io --no-progress --region us-east-1

        # Invalidate Cloudfront (this action)
      - name: invalidate vue app new s3
        if: github.ref == 'refs/heads/master'
        uses: chaitanyapotti/cloudfront-update-distribution@b120c0220453e292a43e5563f008f8e9e52858d6 # v5
        with:
          cloudfront-distribution-id: ${{ secrets.AWS_CLOUDFRONT_NEW_DEMO_APP_DISTRIBUTION_ID }}
          cloudfront-invalidation-path: "/*"
          cloudfront-invalidation-required: true
          cloudfront-wait-for-service-update: false
