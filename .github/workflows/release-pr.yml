name: Create release pull request

# Opens or updates the release pull request. It does not publish.
# Publish by hand from master after that pull request merges.
# The repository must allow GitHub Actions to create pull requests.
# A pull request opened with GITHUB_TOKEN does not start other workflows.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.0"
      - name: Install npm 12
        run: npm install --global npm@12.2.0
      - name: Install dependencies
        run: npm ci
      # The GitHub API commit mode signs the release commit, which master requires.
      - name: Create or update the release pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
